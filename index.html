<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Математика әлемі</title>
<style>
:root{font-family:Arial,sans-serif;color:#172554;background:#eff6ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eff6ff,#f0fdf4)}header{padding:20px 6%;background:#fff;border-bottom:1px solid #dbeafe;font-size:22px;font-weight:900}header span{color:#2563eb}main{max-width:980px;margin:auto;padding:38px 20px}.hero{text-align:center;margin:10px 0 34px}.hero h1{font-size:clamp(34px,6vw,54px);margin:0 0 12px}.hero p,.muted{color:#64748b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.tile,.panel{background:white;border:1px solid #dbeafe;border-radius:22px;padding:25px;box-shadow:0 10px 28px #1e3a8a0c}.tile{cursor:pointer;text-align:left;min-height:210px;transition:.2s}.tile:hover{transform:translateY(-4px);border-color:#60a5fa}.emoji{font-size:48px}.tile h2{margin:12px 0 8px}.tile p{color:#64748b;line-height:1.5}.screen{display:none}.screen.active{display:block}.panel{max-width:700px;margin:auto}.back{border:0;background:none;color:#2563eb;font-weight:bold;cursor:pointer;font-size:15px;margin-bottom:15px}.choices,.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choices button,.levels button{background:#f8fbff;border:1px solid #dbeafe;border-radius:14px;padding:17px;text-align:left;font-weight:bold;font-size:17px;cursor:pointer;color:#172554}.levels{grid-template-columns:1fr}.choices button:hover,.levels button:hover{border-color:#2563eb;background:#eff6ff}.levels small{display:block;color:#64748b;font-weight:normal;margin-top:5px}.tag{float:right;background:#eff6ff;color:#1d4ed8;border-radius:20px;padding:8px 12px;font-size:13px}.arena{background:#eff6ff;border-radius:18px;text-align:center;padding:22px;margin:15px 0}.scene{font-size:58px}.question{text-align:center;font-size:48px;font-weight:900;margin:24px}.answer{display:flex;gap:10px;max-width:400px;margin:auto}.answer input{min-width:0;flex:1;padding:14px;border:2px solid #cbd5e1;border-radius:12px;font-size:22px;text-align:center}.primary{background:#2563eb;color:white;border:0;border-radius:12px;padding:14px 20px;font-weight:bold;cursor:pointer}.feedback{text-align:center;min-height:32px;font-weight:bold;margin:15px}.progress{height:9px;background:#e2e8f0;border-radius:10px;overflow:hidden}.progress div{height:100%;background:#22c55e;width:0}.stats{text-align:center;color:#64748b}.result{text-align:center}.result .emoji{font-size:70px}footer{text-align:center;color:#94a3b8;padding:25px}@media(max-width:650px){.grid{grid-template-columns:1fr}.tile{min-height:auto}.choices{grid-template-columns:1fr}.question{font-size:38px}.answer{flex-direction:column}}
</style></head><body><header>🧠 <span>Математика</span> әлемі</header><main>
<section id="home" class="screen active"><div class="hero"><h1>Математика — қызықты ойын!</h1><p>Ойынды таңда да, біліміңді сына!</p></div><div class="grid">
<button class="tile" onclick="chooseGame('rope')"><div class="emoji">🪢</div><h2>Арқан тарту</h2><p>Дұрыс жауап беріп, қарсыласыңды жең!</p>Ойынды бастау →</button>
<button class="tile" onclick="chooseGame('climb')"><div class="emoji">🌴</div><h2>Бағанға өрмелеу</h2><p>Есептерді шығарып, жоғары көтеріл!</p>Ойынды бастау →</button>
<button class="tile" onclick="chooseGame('race')"><div class="emoji">🏃</div><h2>Қаппен жарыс</h2><p>Дұрыс жауап беріп, мәреге жет!</p>Ойынды бастау →</button></div></section>
<section id="ops" class="screen"><div class="panel"><button class="back" onclick="show('home')">← Артқа</button><h2>Амал түрін таңда</h2><p id="gameName" class="muted"></p><div class="choices"><button onclick="chooseOp('+')">➕ Қосу</button><button onclick="chooseOp('-')">➖ Азайту</button><button onclick="chooseOp('×')">✖️ Көбейту</button><button onclick="chooseOp('÷')">➗ Бөлу</button></div></div></section>
<section id="levels" class="screen"><div class="panel"><button class="back" onclick="show('ops')">← Артқа</button><h2>Қиындық деңгейін таңда</h2><p id="opName" class="muted"></p><div class="levels"><button onclick="start(1)">⭐ Бастауыш<small>Бір таңбалы сандар</small></button><button onclick="start(2)">⭐⭐ Орташа<small>Екі таңбалы сандар</small></button><button onclick="start(3)">⭐⭐⭐ Күрделі<small>Күрделі есептер</small></button></div></div></section>
<section id="play" class="screen"><div class="panel"><button class="back" onclick="show('home')">← Ойыннан шығу</button><span id="tag" class="tag"></span><div class="progress"><div id="bar"></div></div><div class="arena"><div id="scene" class="scene">🧑‍🤝‍🧑 🪢 🧑‍🤝‍🧑</div><p id="hint" class="muted">Дұрыс жауап беріп, алға жылжы!</p></div><div id="question" class="question">2 + 3 = ?</div><div class="answer"><input id="answer" type="number" placeholder="Жауабың"><button class="primary" onclick="check()">Тексеру</button></div><div id="feedback" class="feedback"></div><div class="stats">Ұпай: <b id="score">0</b> · Сұрақ: <b id="count">1/7</b></div></div></section>
<section id="result" class="screen"><div class="panel result"><div class="emoji">🏆</div><h2 id="resultTitle">Жарайсың!</h2><p id="resultText" class="muted"></p><button class="primary" onclick="show('home')">Басты бетке оралу</button></div></section>
</main><footer>© 2026 Математика әлемі • Білім — күш!</footer>
<script>
const names={rope:'Арқан тарту',climb:'Бағанға өрмелеу',race:'Қаппен жарыс'};let game='rope',op='+',level=1,answer=0,score=0,n=0,locked=false;
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function chooseGame(g){game=g;document.getElementById('gameName').textContent=names[g];show('ops')}
function chooseOp(o){op=o;document.getElementById('opName').textContent='Таңдалған амал: '+o;show('levels')}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function question(){let a,b;if(op==='+'){a=rnd(1,level===1?9:level===2?49:99);b=rnd(1,level===1?9:level===2?50:99);answer=a+b}else if(op==='-'){a=rnd(2,level===1?18:level===2?99:150);b=rnd(1,Math.min(a,level===1?9:level===2?50:99));answer=a-b}else if(op==='×'){a=rnd(1,level===1?9:level===2?12:25);b=rnd(1,level===1?9:level===2?12:25);answer=a*b}else{b=rnd(1,level===1?5:level===2?9:12);answer=rnd(1,level===1?10:level===2?15:20);a=b*answer}document.getElementById('question').textContent=a+' '+op+' '+b+' = ?'}
function start(l){level=l;score=0;n=0;locked=false;document.getElementById('tag').textContent=names[game];document.getElementById('score').textContent=0;document.getElementById('feedback').textContent='';document.getElementById('scene').textContent=game==='rope'?'🧑‍🤝‍🧑 🪢 🧑‍🤝‍🧑':game==='climb'?'🧗‍♀️ 🌴':'🏃‍♀️ 🏁 🏃‍♂️';document.getElementById('hint').textContent=game==='rope'?'Арқанды өз жағыңа тарт!':game==='climb'?'Дұрыс жауап — бір қадам жоғары!':'Мәреге қарай секір!';show('play');next()}
function next(){if(n>=7){finish();return}locked=false;document.getElementById('count').textContent=(n+1)+'/7';document.getElementById('bar').style.width=(n/7*100)+'%';document.getElementById('answer').value='';question()}
function check(){if(locked)return;let v=document.getElementById('answer').value;if(v===''){document.getElementById('feedback').textContent='Жауабыңды енгіз!';return}locked=true;let ok=Number(v)===answer;if(ok){score++;document.getElementById('score').textContent=score;document.getElementById('feedback').textContent='Дұрыс! Керемет! 🎉';document.getElementById('feedback').style.color='#16a34a'}else{document.getElementById('feedback').textContent='Қате. Дұрыс жауап: '+answer;document.getElementById('feedback').style.color='#dc2626'}n++;document.getElementById('bar').style.width=(n/7*100)+'%';document.getElementById('scene').textContent=game==='rope'?'🧑‍🤝‍🧑 🪢➡️ 🧍':game==='climb'?'🧗‍♀️ '+'🪜'.repeat(Math.min(score,5))+' 🌴':'🏃‍♀️ '+'　'.repeat(Math.max(0,5-Math.floor(score/2)))+'🏁';setTimeout(next,800)}
function finish(){show('result');document.getElementById('resultTitle').textContent=score===7?'Тамаша! Барлығы дұрыс!':score>=4?'Жақсы нәтиже!':'Талпынысың үшін рақмет!';document.getElementById('resultText').textContent='7 сұрақтың '+score+'-іне дұрыс жауап бердің!'}
document.getElementById('answer').addEventListener('keydown',e=>{if(e.key==='Enter')check()});
</script></body></html>
